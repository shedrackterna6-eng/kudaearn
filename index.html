<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuda Earn</title>
<style>
:root{--g:#16a34a;--bg:#f2f7f3;--card:#fff;--tx:#0f1f17;--mu:#66756c;--bd:#e0e9e3;--y:#d99a00;--yb:#fff6dc;--r:#dc2626;--rb:#fde8e8;--gb:#e3f6ea}
@media (prefers-color-scheme:dark){:root{--bg:#0c1511;--card:#14211a;--tx:#e8f1ec;--mu:#8fa498;--bd:#22342a;--yb:#3a2f08;--rb:#3a1414;--gb:#12301f}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:480px;margin:0 auto;padding:14px 16px 110px}
h1{font-size:26px;margin:14px 0 2px}h2{font-size:17px;margin:0 0 8px}p{margin:0;color:var(--mu);font-size:14px}
.top{display:flex;align-items:center;gap:10px;margin:6px 0 14px}.logo{width:38px;height:38px;border-radius:12px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:14px}
.bal{background:linear-gradient(135deg,#1fb454,#0f6b34);color:#fff;border:0}.bal p{color:#d3f5de}.bal .n{font-size:34px;font-weight:800;margin:6px 0}
.btn{background:var(--g);color:#fff;border:0;border-radius:14px;padding:13px 18px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;width:100%}
.btn.sm{width:auto;padding:9px 14px;font-size:13px}.btn.o{background:transparent;color:var(--g);border:1.5px solid var(--g)}.btn.y{background:#fbbf24;color:#3b2a00}.btn.r{background:var(--r)}.btn:disabled{opacity:.45}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.tabs{display:flex;gap:8px;margin:12px 0;overflow-x:auto}
.tab{border:1.5px solid var(--bd);background:var(--card);color:var(--mu);border-radius:999px;padding:9px 16px;font:inherit;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer}.tab.on{background:var(--g);border-color:var(--g);color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--bd);color:var(--mu)}.tag.p{background:var(--yb);color:var(--y)}.tag.a{background:var(--gb);color:var(--g)}.tag.x{background:var(--rb);color:var(--r)}
.ico{width:46px;height:46px;border-radius:14px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:22px;flex:none}.rew{color:var(--g);font-weight:800;font-size:18px}
input,select{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin:6px 0}label{font-size:13px;font-weight:600;color:var(--mu)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:456px;background:var(--card);border:1px solid var(--bd);border-radius:26px;display:flex;justify-content:space-around;padding:8px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
nav button{background:none;border:0;border-radius:18px;padding:8px 10px;color:var(--mu);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}nav button span{font-size:20px}nav button.on{background:var(--gb);color:var(--g)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.acct{background:var(--bg);border:1.5px dashed var(--g);border-radius:14px;padding:12px;margin:10px 0;font-weight:700;line-height:1.7}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#0f6b34;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:20;pointer-events:none;max-width:90%;text-align:center}#toast.s{opacity:1}
.step{display:flex;gap:12px;align-items:center;border:1px solid var(--bd);border-radius:16px;padding:12px;margin-top:10px;cursor:pointer}.num{width:34px;height:34px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-weight:800;flex:none}
.big{font-size:30px;font-weight:800;text-align:center;margin:6px 0}.c{text-align:center}.sp{height:12px}
</style></head><body><div id="app"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient('https://ypuyyqbogttwqscbdmvw.supabase.co','sb_publishable_pvq4L_ApltQJyuXhPHW6gg_Gk5C7hnd');
const $=s=>document.querySelector(s),N=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2});
const S={view:'home',tab:'all',wt:'task',auth:'login',m:null,step:1,file:null};
let P=null,T=[],SUB=[],PAY=[],REF=[],A={pay:[],sub:[],wd:[],users:[]};
const REFQ=new URLSearchParams(location.search).get('ref')||'';if(REFQ)S.auth='signup';
function toast(m){const t=$('#toast');t.textContent=m;t.className='s';setTimeout(()=>t.className='',2600)}
const go=v=>{S.view=v;draw();scrollTo(0,0)};
const tag=s=>s==='pending'?'<span class="tag p">Pending</span>':s==='approved'||s==='activated'||s==='paid'?`<span class="tag a">${s==='approved'?'Approved':s==='paid'?'Paid':'Activated'}</span>`:'<span class="tag x">Rejected</span>';
const act=()=>P&&P.activated;
async function load(){
 const{data:{session}}=await sb.auth.getSession();if(!session){P=null;return draw()}
 const u=session.user.id;
 const[p,t,s,y,r]=await Promise.all([sb.from('profiles').select('*').eq('id',u).single(),
  sb.from('tasks').select('*').eq('active',true).order('id'),
  sb.from('submissions').select('*,tasks(title,reward)').eq('user_id',u).order('id',{ascending:false}),
  sb.from('payments').select('*').eq('user_id',u).order('id',{ascending:false}),
  sb.from('profiles').select('full_name,activated').eq('referred_by',u)]);
 P=p.data;T=t.data||[];SUB=s.data||[];PAY=y.data||[];REF=r.data||[];
 if(P&&P.is_admin){const[a,b,c,d]=await Promise.all([
  sb.from('payments').select('*,profiles(full_name,email)').eq('status','pending'),
  sb.from('submissions').select('*,profiles(full_name),tasks(title)').eq('status','pending'),
  sb.from('withdrawals').select('*,profiles(full_name,bank_name,account_number,account_name)').eq('status','pending'),
  sb.from('profiles').select('id,full_name,email')]);
  A={pay:a.data||[],sub:b.data||[],wd:c.data||[],users:d.data||[]}}
 draw()}
async function doAuth(){const e=$('#em').value.trim(),w=$('#pw').value;let r;
 if(S.auth==='login')r=await sb.auth.signInWithPassword({email:e,password:w});
 else r=await sb.auth.signUp({email:e,password:w,options:{data:{full_name:$('#nm').value,ref:$('#rf').value}}});
 if(r.error)return toast(r.error.message);
 if(!r.data.session)return toast('Check your email to confirm, then log in');load()}
async function rpc(f,a,msg){const{error}=await sb.rpc(f,a);if(error)return toast(error.message);toast(msg);load()}
async function up(){const f=S.file;if(!f){toast('Choose a screenshot first');return null}
 const path=P.id+'/'+Date.now()+'_'+f.name.replace(/[^\w.]/g,'_');const{error}=await sb.storage.from('proofs').upload(path,f);
 if(error){toast(error.message);return null}return path}
async function sendPay(){const p=await up();if(!p)return;const{error}=await sb.from('payments').insert({user_id:P.id,proof_path:p});
 if(error)return toast(error.message);S.m=null;S.file=null;toast('Sent for admin approval');load()}
async function sendTask(id){const p=await up();if(!p)return;const{error}=await sb.from('submissions').insert({user_id:P.id,task_id:id,proof_path:p});
 if(error)return toast(error.message);S.m=null;S.file=null;S.tab='all';toast('Submitted. Waiting for approval');load()}
async function view(p){const{data}=await sb.storage.from('proofs').createSignedUrl(p,300);if(data)window.open(data.signedUrl)}
async function addT(){const t=$('#tt').value,r=+$('#tr').value;if(!t||!r)return toast('Add a title and reward');
 const{error}=await sb.from('tasks').insert({title:t,description:$('#td').value,reward:r,link:$('#tl').value});if(error)return toast(error.message);toast('Task published');load()}
function addM(){const a=+$('#ma').value;if(!a)return toast('Enter an amount');rpc('admin_add_money',{uid:$('#mu').value,wallet:$('#mw').value,amt:a},N(a)+' added')}
function saveBank(){rpc('save_bank',{b:$('#bk').value,n:$('#bn').value,a:$('#ba').value},'Bank details saved')}
function withdraw(){const a=+$('#wa').value;if(!P.account_number)return toast('Add your bank details in Profile first');rpc('request_withdrawal',{w:S.wt,amt:a},'Withdrawal requested')}
function win(k){const n=new Date(Date.now()+36e5),c=n.getUTCHours()*60+n.getUTCMinutes(),s=k==='task'?1200:1020;
 if(c>=s&&c<s+30)return{open:true};const d=(s-c+1440)%1440;return{open:false,t:Math.floor(d/60)+'h '+d%60+'m'}}
const setF=i=>{S.file=i.files[0]||null;const b=$('#sb');if(b)b.disabled=!S.file;$('#fn').textContent=S.file?'Sel
