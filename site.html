  insert(b){q.m='POST';q.b=b;return o},then(a,b){return run().then(a,b)}};

 return o}

<div class="card"><h2>Activation payments</h2>${a.pay.map(x=>`<div class="row" style="margin-bottom:12px"><div><b>${x.profiles.full_name||x.profiles.email}</b><p><a href="#" onclick="view('${x.proof_path}');return false" style="color:var(--g)">View proof</a></p></div><div class="row"><button class="btn sm" onclick="rpc('approve_payment',{pid:${x.id}},'Account activated')">Approve</button><button class="btn sm r" onclick="rpc('reject_payment',{pid:${x.id}},'Rejected')">Reject</button></div></div>`).join('')||'<p>No pending payments.</p>'}</div>
<div class="card"><h2>Task submissions</h2>${a.sub.map(x=>`<div class="row" style="margin-bottom:12px"><div><b>${x.profiles.full_name||'Member'}</b><p>${x.tasks.title} · <a href="#" onclick="view('${x.proof_path}');return false" style="color:var(--g)">View proof</a></p></div><div class="row"><button class="btn sm" onclick="rpc('review_submission',{sid:${x.id},ok:true},'Approved. Reward paid')">Approve</button><button class="btn sm r" onclick="rpc('review_submission',{sid:${x.id},ok:false,why:'Proof not accepted'},'Rejected')">Reject</button></div></div>`).join('')||'<p>No pending submissions.</p>'}</div>
<div class="card"><h2>Withdrawal requests</h2>${a.wd.map(x=>`<div style="margin-bottom:14px"><b>${N(x.amount)}</b> · ${x.wallet==='task'?'Task':'Affiliate'} wallet<p>${x.profiles.full_name||''}<br>${x.profiles.bank_name||'No bank'} · ${x.profiles.account_number||''}<br>${x.profiles.account_name||''}</p><div class="row" style="margin-top:8px"><button class="btn sm" onclick="rpc('mark_withdrawal',{wid:${x.id},paid:true},'Marked as paid')">Mark paid</button><button class="btn sm r" onclick="rpc('mark_withdrawal',{wid:${x.id},paid:false},'Rejected and refunded')">Reject</button></div></div>`).join('')||'<p>No pending withdrawals.</p>'}</div>
<div class="card"><h2>Add a new task</h2><input id="tt" placeholder="Task title"><input id="td" placeholder="Short description"><input id="tr" type="number" placeholder="Reward (₦)"><input id="tl" placeholder="Link (https://...)"><button class="btn" onclick="addT()">Publish task</button></div>
<div class="card"><h2>Add money to a user</h2><select id="mu">${a.users.map(u=>`<option value="${u.id}">${u.full_name||u.email}</option>`).join('')}</select><select id="mw"><option value="task">Task wallet</option><option value="aff">Affiliate wallet</option></select><input id="ma" type="number" placeholder="Amount (₦)"><button class="btn" onclick="addM()">Add money</button></div>
<button class="btn o" onclick="go('profile')">Exit admin</button>`}
function modal(){const m=S.m;if(!m)return '';let c='';
 if(m==='fund'){const pend=PAY.find(x=>x.status==='pending');
  c=act()?`<h2>Account activated</h2><button class="btn" onclick="S.m=null;draw()">Continue</button>`:pend?`<h2>Waiting for approval</h2><p>Your payment proof was sent. You can start tasks once admin approves.</p><div class="sp"></div><button class="btn" onclick="S.m=null;draw()">Close</button>`:
  `<h2>Activate your account</h2><p>Pay ₦1,000 to this account, then send your proof.</p><div class="acct">Opay<br>7075181252<br>Veronica Dooshima Apinega</div>${fileBox()}<button id="sb" class="btn" disabled onclick="sendPay()">Submit for admin approval</button><div class="sp"></div><button class="btn o" onclick="S.m=null;draw()">Cancel</button>`}
 else{const t=T.find(x=>x.id===m.t);c=S.step===1?`<h2>${t.title}</h2><p>Join the channel, then come back here.</p><div class="step" onclick="window.open('${t.link}','_blank')"><div class="num">1</div><b>Open the Telegram channel</b></div><div class="sp"></div><button class="btn" onclick="S.step=2;draw()">I completed the task</button>`:`<h2>Send your proof</h2><p>Upload a screenshot showing you joined.</p>${fileBox()}<button id="sb" class="btn" disabled onclick="sendTask(${t.id})">Submit for admin approval</button>`;c+=`<div class="sp"></div><button class="btn o" onclick="S.m=null;draw()">Cancel</button>`}
 return `<div class="ov"><div class="sheet">${c}</div></div>`}
function draw(){const a=$('#app');if(!P){a.innerHTML=auth();return}
 const v=({home,tasks,wallet,refer,profile,admin})[S.view]();a.innerHTML=v+(S.view==='admin'?'':nav())+modal()}
load().catch(e=>{P=null;draw();toast(e.message)});
</script></body></html>
