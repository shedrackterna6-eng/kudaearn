function home(){const pend=PAY.find(x=>x.status==='pending');return `<div class="top"><div class="logo">K</div><div><p>Good day</p><b>${P.full_name||'Member'}</b></div></div>
${act()?'':`<div class="card"><h2>Finish setting up</h2><p>Activate your account to start earning.</p><div class="step" onclick="S.m='fund';draw()"><div class="num">1</div><div><b>Activate your account</b><p>${pend?'Waiting for admin approval':'One-time fee of ₦1,000'}</p></div></div></div>`}
<div class="card bal"><p>TOTAL BALANCE</p><div class="n">${N(+P.task_balance+ +P.aff_balance)}</div><button class="btn y sm" onclick="go('wallet')">Withdraw</button></div>
<div class="row" style="gap:12px"><div class="card" style="flex:1"><p>Task earnings</p><b>${N(P.task_balance)}</b></div><div class="card" style="flex:1"><p>Referral earnings</p><b>${N(P.aff_balance)}</b></div></div>
<div class="card row"><div><h2>Ready for a task?</h2><p>${T.length} available</p></div><button class="btn sm" onclick="go('tasks')">View tasks</button></div>`}
function tasks(){let b='';
 if(S.tab==='all')b=T.map(t=>{const s=SUB.find(x=>x.task_id===t.id&&x.status!=='rejected'),r=SUB.find(x=>x.task_id===t.id);
  return `<div class="card"><div class="row"><div class="ico">✈</div><div style="flex:1"><b>${t.title}</b><p>${t.description||''}</p></div><div class="c"><div class="rew">${N(t.reward)}</div><p>reward</p></div></div><div class="row" style="margin-top:14px">${r?tag(r.status):'<span class="tag">Screenshot</span>'}<button class="btn sm" ${s?'disabled':''} onclick="${act()?`S.m={t:${t.id}};S.step=1;S.file=null;draw()`:`S.m='fund';draw()`}">${s?'Submitted':act()?'Start Task':'Activate first'}</button></div></div>`}).join('')||'<div class="card c"><p>No tasks yet. Check back soon.</p></div>';
 else{const l=SUB.filter(x=>x.status===S.tab);b=l.length?l.map(x=>`<div class="card row"><div><b>${x.tasks?x.tasks.title:'Task'}</b><p>${N(x.tasks?x.tasks.reward:0)}</p></div>${tag(x.status)}</div>`).join(''):`<div class="card c"><p>Nothing ${S.tab} yet.</p></div>`}
 return `<h1>Tasks</h1><p>Complete tasks and earn rewards</p><div class="tabs">${[['all','All'],['pending','Pending'],['approved','Approved'],['rejected','Rejected']].map(x=>`<button class="tab ${S.tab===x[0]?'on':''}" onclick="S.tab='${x[0]}';draw()">${x[1]}</button>`).join('')}</div>${b}`}
function wallet(){const k=S.wt,w=win(k);return `<h1>Withdraw</h1><p>Cash out to your bank account</p><div class="tabs"><button class="tab ${k==='task'?'on':''}" onclick="S.wt='task';draw()">Task Wallet</button><button class="tab ${k==='aff'?'on':''}" onclick="S.wt='aff';draw()">Affiliate Wallet</button></div>
<div class="card bal"><p>${k==='task'?'TASK':'AFFILIATE'} WALLET</p><div class="n">${N(P[k+'_balance'])}</div><p>Available balance</p></div>
<div class="card c"><h2 style="text-align:left">Withdrawal Amount</h2>${w.open?`<input id="wa" type="number" placeholder="Enter amount"><button class="btn" onclick="withdraw()">Request withdrawal</button>`:`<div style="font-size:38px;margin-top:8px">🔒</div><h2>Window Closed</h2><p>Opens in</p><div class="big">${w.t}</div>`}<p style="margin-top:8px">Open daily ${k==='task'?'8:00 – 8:30 PM':'5:00 – 5:30 PM'}</p></div>`}
function refer(){const l=location.origin+location.pathname+'?ref='+P.ref_code;return `<h1>Refer & earn</h1><p>Earn ₦500 when a friend activates</p><div class="card"><label>Your referral link</label><input readonly value="${l}"><button class="btn" onclick="navigator.clipboard.writeText('${l}');toast('Link copied')">Copy link</button></div>
<h2>Your referrals</h2>${REF.length?REF.map(r=>`<div class="card row"><div><b>${r.full_name||'Member'}</b><p>${r.activated?'+₦500 earned':'Has not activated yet'}</p></div>${tag(r.activated?'activated':'pending')}</div>`).join(''):'<div class="card c"><p>No referrals yet. Share your link.</p></div>'}`}
function profile(){return `<h1>Profile</h1><div class="card"><b>${P.full_name||''}</b><p>${P.email}</p><p>${act()?'Account activated':'Not activated'}</p></div>
<div class="card"><h2>Bank details</h2><input id="bk" placeholder="Bank name" value="${P.bank_name||''}"><input id="bn" placeholder="Account number" value="${P.account_number||''}"><input id="ba" placeholder="Account name" value="${P.account_name||''}"><button class="btn" onclick="saveBank()">Save bank details</button></div>
${act()?'':`<button class="btn" onclick="S.m='fund';draw()">Activate for ₦1,000</button><div class="sp"></div>`}${P.is_admin?`<button class="btn o" onclick="go('admin')">Admin dashboard</button><div class="sp"></div>`:''}<button class="btn o" onclick="sb.auth.signOut().then(load)">Log out</button>`}
function admin(){const a=A,pr=(a.pay.length+a.sub.length+a.wd.length);
 return `<div class="top"><div class="logo">A</div><b style="font-size:20px">Admin dashboard</b></div>
<div class="row" style="gap:10px"><div class="card" style="flex:1"><p>Users</p><b>${a.users.length}</b></div><div class="card" style="flex:1"><p>Pending items</p><b>${pr}</b></div></div>
<div class="card"><h2>Activation payments</h2>${a.pay.map(x=>`<div class="row" style="margin-bottom:12px"><div><b>${x.profiles.full_name||x.profiles.email}</b><p><a href="#" onclick="view('${x.proof_path}');return false" style="color:var(--g)">View proof</a></p></div><div class="row"><button class="btn sm" onclick="rpc('approve_payment',{pid:${x.id}},'Account activated')">Approve</button><button class="btn sm r" onclick="rpc('reject_payment',{pid:${x.id}},'Rejected')">Reject</button></div></div>`).join('')||'<p>No pending payments.</p>'}</div>
<div class="card"><h2>Task submissions</h2>${a.sub.map(x=>`<div class="row" style="margin-bottom:12px"><div><b>${x.profiles.full_name||'Member'}</b><p>${x.tasks.title} · <a href="#" onclick="view('${x.proof_path}');return false" style="color:var(--g)">View proof</a></p></div><div class="row"><button class="btn sm" onclick="rpc('review_submission',{sid:${x.id},ok:true},'Approved. Reward paid')">Approve</button><button class="btn sm r" onclick="rpc('review_submission',{sid:${x.id},ok:false,why:'Proof not accepted'},'Rejected')">Reject</button></div></div>`).join('')||'<p>No pending submissions.</p>'}</div>
<div class="card"><h2>Withdrawal requests</h2>${a.wd.map(x=>`<div style="margin-bottom:14px"><b>${N(x.amount)}</b> · ${x.wallet==='task'?'Task':'Affiliate'} wallet<p>${x.profiles.full_name||''}<br>${x.profiles.bank_name||'No bank'} · ${x.profiles.account_number||''}<br>${x.profiles.account_name||''}</p><div class="row" style="margin-top:8px"><button class="btn sm" onclick="rpc('mark_withdrawal',{wid:${x.id},paid:true},'Marked as paid')">Mark paid</button><button class="btn sm r" onclick="rpc('mark_withdrawal',{wid:${x.id},paid:false},'Rejected and refunded')">Reject</button></div></div>`).join('')||'<p>No pending withdrawals.</p>'}</div>
<div class="card"><h2>Add a new task</h2><input id="tt" placeholder="Task title"><input id="td" placeholder="Short description"><input id="tr" type="number" placeholder="Reward (₦)"><input id="tl" placeholder="Link (https://...)"><button class="btn" onclick="addT()">Publish task</button></div>
<div class="card"><h2>Add money to a user</h2><select id="mu">${a.users.map(u=>`<option value="${u.id}">${u.full_name||u.email}</option>`).join('')}</select><select id="mw"><option value="task">Task wallet</option><option value="aff">Affiliate wallet</option></select><input id="ma" type="number" placeholder="Amount (₦)"><button class="btn" onclick="addM()">Add money</button></div>
<button class="btn o" onclick="go('profile')">Exit admin</button>`}
function modal(){const m=S.m;if(!m)return '';let c='';
 if(m==='fund'){const pend=PAY.find(x=>x.status==='pending');
  c=act()?`<h2>Account activated</h2><button class="btn" onclick="S.m=null;draw()">Continue</button>`:pend?`<h2>Waiting for approval</h2><p>Your payment proof was sent. You can start tasks once admin approves.</p><div class="sp"></div><button class="btn" onclick="S.m=null;draw()">Close</button>`:
  `<h2>Activate your account</h2><p>Pay ₦1,000 to this account, then send your proof.</p><div class="acct">Opay<br>7075181252<br>Veronica Dooshima Apinega</div>${fileBox()}<button id="sb" class="btn" disabled onclick="sendPay()">Submit for admin approval</button><div class="sp"></div><button class="btn o" onclick="S.m=null;draw()">Cancel</button>`}
 else{const t=T.find(x=>x.id===m.t);c=S.step===1?`<h2>${t.title}</h2><p>Join the channel, then come back here.</p><div class="step" onclick="window.open('${t.link}','_blank')"><div class="num">1</div><b>Open the Telegram channel</b></div><div class="sp"></div><button class="btn" onclick="S.step=2;draw()">I completed the task</button>`:`<h2>Send your proof</h2><p>Upload a screenshot showing you joined.</p>${fileBox()}<button id="sb" class="btn" disabled onclick="sendTask(${t.id})">Submit for admin approval</button>`;c+=`<div class="sp"></div><button class="btn o" onclick="S.m=null;draw()">Cancel</button>`}
 return `<div class="ov"><div class="sheet">${c}</div></div>`}
function draw(){const a=$('#app');if(!P){a.innerHTML=auth();return}
 const v=({home,tasks,wallet,refer,profile,admin})[S.view]();a.innerHTML=v+(S.view==='admin'?'':nav())+modal()}
load().catch(e=>{P=null;draw();toast(e.message)});
</script></body></html>
